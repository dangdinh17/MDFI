dataset:
  train:  # LMDB
    type: LDV2_TrainDataset
    
    root: data/MOT20_processed
    gt_folder: raw
    lq_folder: lq
    pd_folder: pd

    # for dataset lmdb
    gt_path: gt.lmdb
    lq_path: lq.lmdb
    pd_path: pd.lmdb
    
    meta_info_fp: meta_info.txt
    gt_size: 128  # ground truth patch size: gt_size * gt_size
    use_flip: True
    use_rot: True  # rotation per 90 degrees
    random_reverse: False

    # for datasampler
    enlarge_ratio: 300  # enlarge dataset by randomly cropping.

    # for dataloader
    num_worker_per_gpu: 12  # 12 in total. mainly affect IO speed
    batch_size_per_gpu: 32  # bs=8, divided by 1 GPUs
  val:  # Disk IO
    type: OVQEDataset
    root: data/val_18_50
    gt_path: gt
    lq_path: lq
    pd_path: pd

  test:
    type: OVQEDataset
    gt_path: test_18/raw/
    lq_path: test_18/HM16.5_LDP/QP37/

network:
  radius: 3  # total num of input frame = 2 * radius + 1
  swinunet:
    load_path: ckp_520000.pt
    patch_size: 4
    in_chans: 7
    out_chans: 32
    embed_dim: 48
    depths: [2, 2, 2]
    num_heads: [2, 2, 2]
    window_size: 8
    mlp_ratio: 1.
    qkv_bias: False
    qk_scale: 2

  qenet:
    in_nc: 32  # = out_nc of stdf
    out_nc: 1  # 1 for Y
    nf: 48
    nb: 8
    base_ks: 3
    dim: 32
    heads: [1]   # total num of input frame = 2 * radius + 1

QP: 37
AMP: True

train:
  exp_name: TVQE_QP37 # default: timestr. None: ~
  random_seed: 7
  pre-val: False  # evaluate criterion before training, e.g., ori PSNR
  num_iter: !!float 10000
  interval_print: !!float 100
  interval_val: !!float 1000 # also save model
  pbar_len: 100
  load_best_weight: checkpoint/TVQE_QP37.pt #weigt path or False
  checkpoint: None # path or none
  optim:
    type: Adam
    lr: !!float 1e-5  # init lr of scheduler
    betas: [0.9, 0.999]
    eps: !!float 1e-08

  scheduler:
    is_on: False
    type: CosineAnnealingRestartLR
    periods: [!!float 5e+4, !!float 5e+4, !!float 5e+4, !!float 5e+4, !!float 5e+4, !!float 5e+4]  # epoch interval
    restart_weights: [1, 0.5, 0.5, 0.5, 0.5, 0.5]
    eta_min: !!float 1e-7

  loss:
    type: CharbonnierLoss
    eps: !!float 1e-6

  criterion:
    type: PSNR
    unit: dB

comet_logging:
  using: False
  previous_experiment: False   #False or prev exp key
  api_key: mkfmxVIjacb8h74qKO6NzPdPN # your comet api key
  project_name: ovqe-project
  workspace: dangdinh17
