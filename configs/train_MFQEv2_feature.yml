dataset:
  root: datasets/108data/train_108
  gt_path: gt.lmdb
  lq_path: QP{qp}/lq.lmdb
  label_path: datasets/108data/feature_pqf/QP{qp}_lpips_alex.json
  crop_size: 128
  train_clips: [1, 100]
  val_clips: [101, 108]
  val_max_samples: 256
  use_flip: true
  use_rot: true
  random_reverse: true
  num_workers: 4
  batch_size: 8
  cache_mode: ram

model:
  num_features: 32
  max_displacement: 12.0

loss:
  charbonnier_weight: 1.0
  charbonnier_eps: 1.0e-6
  feature_weight: 0.01
  feature_metric: LPIPS-AlexNet-v0.1

train:
  num_iter: 10000
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 0.0
  seed: 7
  amp: true
  print_interval: 50
  validation_interval: 1000
  checkpoint_interval: 2000
  gradient_clip: 5.0
  output_dir: exp/MFQEv2_feature_QP{qp}/enhancer
